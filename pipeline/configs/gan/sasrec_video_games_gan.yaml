# SASRec — Fashion selective GAN augmentation

dataset: Video_Games_selective_gan_augmented
data_path: /content/drive/MyDrive/Wits_Honours_Project/datasets/

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

load_col:
  inter: [user_id, item_id, timestamp]

ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50

# Model
embedding_size: 64
hidden_size: 64
num_layers: 2
num_heads: 2
dropout_prob: 0.2
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2

# Training
epochs: 100
train_batch_size: 128
learning_rate: 0.001
stopping_step: 10
eval_step: 1

loss_type: CE
train_neg_sample_args: null

# Reproducibility
seed: 42
reproducibility: True

# Evaluation
eval_args:
  group_by: user
  order: TO
  split:
    LS: valid_and_test
  mode: full

metrics:
  - Recall
  - MRR
  - NDCG
  - Hit

topk: 10
valid_metric: NDCG@10
metric_decimal_place: 4

# Hardware
gpu_id: 0

# Experiment outputs
checkpoint_dir: /content/drive/MyDrive/Wits_Honours_Project/saved/sasrec_fashion_selective_gan

save_dataset: False
save_dataloaders: False

dataset_save_path: /content/drive/MyDrive/Wits_Honours_Project/saved/sasrec_fashion_selective_gan/Fashion_selective_gan_augmented-dataset.pth
dataloaders_save_path: /content/drive/MyDrive/Wits_Honours_Project/saved/sasrec_fashion_selective_gan/Fashion_selective_gan_augmented-dataloaders.pth