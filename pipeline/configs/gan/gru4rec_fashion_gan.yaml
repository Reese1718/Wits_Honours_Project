# GRU4Rec — Fashion selective GAN augmentation

dataset: Fashion_selective_gan_augmented
data_path: /content/drive/MyDrive/Wits_Honours_Project/datasets/

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

load_col:
  inter: [user_id, item_id, timestamp]

ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50

# Model
embedding_size: 64
hidden_size: 128
num_layers: 1
dropout_prob: 0.2
loss_type: CE

# Training
epochs: 20
train_batch_size: 128
eval_batch_size: 128
learning_rate: 0.001
stopping_step: 10
eval_step: 1

train_neg_sample_args: null

clip_grad_norm:
  max_norm: 1.0
  norm_type: 2

enable_amp: False
enable_scaler: False

worker: 2

# Reproducibility
seed: 42
reproducibility: True

# Evaluation
eval_args:
  group_by: user
  order: TO
  split:
    LS: valid_and_test
  mode: full

metrics:
  - Recall
  - MRR
  - NDCG
  - Hit

topk: 10
valid_metric: NDCG@10
metric_decimal_place: 4

# Hardware
gpu_id: 0

# Experiment outputs
checkpoint_dir: /content/drive/MyDrive/Wits_Honours_Project/saved/gru4rec_fashion_selective_gan

save_dataset: False
save_dataloaders: False

dataset_save_path: /content/drive/MyDrive/Wits_Honours_Project/saved/gru4rec_fashion_selective_gan/Fashion_selective_gan_augmented-dataset.pth
dataloaders_save_path: /content/drive/MyDrive/Wits_Honours_Project/saved/gru4rec_fashion_selective_gan/Fashion_selective_gan_augmented-dataloaders.pth