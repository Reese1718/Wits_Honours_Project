# ==========================================================
# BERT4Rec Configuration - Fashion
# ==========================================================

# ----------------------------------------------------------
# Dataset
# ----------------------------------------------------------

dataset: Fashion
data_path: /content/drive/MyDrive/Wits_Honours_Project/datasets/

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

load_col:
  inter: [user_id, item_id, timestamp]


# ----------------------------------------------------------
# Sequential Recommendation
# ----------------------------------------------------------

ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list

# Maximum number of historical items used by BERT4Rec
MAX_ITEM_LIST_LENGTH: 50


# ----------------------------------------------------------
# Model - BERT4Rec
# ----------------------------------------------------------

# Item embedding / Transformer hidden dimension
hidden_size: 64

# Feed-forward layer dimension
inner_size: 256

# Number of Transformer encoder layers
n_layers: 2

# Number of attention heads
n_heads: 2

# Dropout
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2

# Activation function
hidden_act: gelu

# Layer normalization
layer_norm_eps: 1e-12

# Weight initialization
initializer_range: 0.02

# Probability of masking an item during training
mask_ratio: 0.2

# Cross-entropy objective
loss_type: CE


# ----------------------------------------------------------
# Training
# ----------------------------------------------------------

epochs: 100

train_batch_size: 256

learning_rate: 0.001

stopping_step: 10

eval_step: 1

# CE does not require negative sampling
train_neg_sample_args: null


# ----------------------------------------------------------
# Reproducibility
# ----------------------------------------------------------

seed: 42

reproducibility: True


# ----------------------------------------------------------
# Evaluation
# ----------------------------------------------------------

eval_args:
  group_by: user
  order: TO
  split:
    LS: valid_and_test
  mode: full

metrics:
  - Recall
  - MRR
  - NDCG
  - Hit

topk: 10

valid_metric: NDCG@10

metric_decimal_place: 4


# ----------------------------------------------------------
# Hardware
# ----------------------------------------------------------

gpu_id: 0