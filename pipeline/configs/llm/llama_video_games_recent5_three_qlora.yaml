experiment:
  name: llama_video_games_recent5_three_qlora
  dataset: Video Games
  seed: 42

model:
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  name: meta-llama/Llama-3.2-3B-Instruct
  trust_remote_code: false
  attention_implementation: sdpa
  eos_token: "<|eot_id|>"

data:
  train_file: /datasets/dnaidoo3/Video_Games/processed/llm/sft/train_recent5_three_per_user.jsonl
  validation_file: /datasets/dnaidoo3/Video_Games/processed/llm/sft/validation_recent5.jsonl

  preprocessing_workers: 4

  max_train_samples: null
  max_validation_samples: 5000
  shuffle_before_sampling: true

  metadata_file: /datasets/dnaidoo3/Video_Games/exports/Video_Games_metadata_lookup.json
  catalogue_file: /datasets/dnaidoo3/Video_Games/processed/llm/splits/item_catalogue.json
  validation_split_file: /datasets/dnaidoo3/Video_Games/processed/llm/splits/validation.jsonl
  test_split_file: /datasets/dnaidoo3/Video_Games/processed/llm/splits/test.jsonl

quantization:
  compute_dtype: float16
  quant_type: nf4
  use_double_quant: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: all-linear

training:
  output_dir: /datasets/dnaidoo3/Video_Games/processed/llm/checkpoints/llama_recent5_three

  epochs: 1

  train_batch_size: 8
  eval_batch_size: 8
  gradient_accumulation_steps: 2

  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optimizer: paged_adamw_8bit
  max_grad_norm: 0.3

  max_sequence_length: 1024
  gradient_checkpointing: true
  packing: false

  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1

  dataloader_workers: 4
  report_to: none

checkpoint_selection:
  top_k: 10
  num_beams: 20
  batch_size: 4
  max_validation_users: 5000
  max_history_length: 5
  exclude_history_items: true
  length_penalty: 1.0

generation:
  top_k: 10
  num_beams: 20
  batch_size: 4
  max_history_length: 5
  max_new_tokens: 24
  exclude_history_items: true
  length_penalty: 1.0
